name: dotfiles
version: 0.1.0
description: MCP servers and plugins deployed to this machine's user scope
author: boykush
# 自動検出に任せず名指しする。検出は ~/.codex や ~/.claude.json の有無を見るので、
# 新環境の初回適用で Codex だけ落ちるような差が出る。
targets:
  - claude
  - codex
dependencies:
  apm:
    - boykush/ai-plugins/plugins/wiki-remote-mcp#fdb71842c6cff55e022c3663c26f95b220c01795
    # 使うのはこのマシンだけなので、plugin にも tag にもせず path で引く。
    - ~/dotfiles/.apm/skills/doc-refactor
    # 外から来る plugin はここだけで宣言する。
    - anthropics/claude-plugins-official/plugins/skill-creator#d586c3f10a8c2366179bf46b097b4f652622ffc6
  mcp: []

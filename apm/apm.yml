name: dotfiles
version: 0.1.0
description: MCP servers and plugins deployed to this machine's user scope
author: boykush
# 自動検出に任せず名指しする。検出は ~/.codex や ~/.claude.json の有無を見るので、
# 新環境の初回適用で Codex だけ落ちるような差が出る。
targets:
  - claude
  - codex
dependencies:
  apm:
    - boykush/ai-plugins/plugins/wiki-remote-mcp#976890acce13160d65bae0d651243f03c1acb874
    # 使うのはこのマシンだけなので、plugin にも tag にもせず path で引く。
    - ~/dotfiles/.apm/skills/doc-refactor
    # 外から来る plugin はここだけで宣言する。
    - anthropics/claude-plugins-official/plugins/skill-creator#4f2303046518925cde9907d25e23bf85645849eb
  mcp: []

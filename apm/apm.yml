name: dotfiles
version: 0.1.0
description: MCP servers and plugins deployed to this machine's user scope
author: boykush
# 自動検出に任せず名指しする。検出は ~/.codex や ~/.claude.json の有無を見るので、
# 新環境の初回適用で Codex だけ落ちるような差が出る。
targets:
  - claude
  - codex
dependencies:
  apm:
    - boykush/wiki/plugins/wiki-remote-mcp#29d89d60302247578487059899805a7da39a72b2 # wiki-remote-mcp--v0.1.0
    # 使うのはこのマシンだけなので、plugin にも tag にもせず path で引く。
    - ~/dotfiles/.apm/skills/doc-refactor
    # 外から来る plugin はここだけで宣言する。
    - anthropics/claude-plugins-official/plugins/skill-creator#73c8cf3ea7e296057b467990f2f5d61b4c922260
  mcp: []

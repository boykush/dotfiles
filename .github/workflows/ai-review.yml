# owner の PR を boykush/adr のルールと照合し、違反が無ければ Claude GitHub App として承認する。
# default branch の ruleset が求める承認は、これで付く。reusable workflow は boykush/workflows
# にあり、入れるときに要るものはその README に書いてある。
name: ai-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: boykush/workflows/.github/workflows/ai-review.yml@566ee889c89c3dbe79c80ca988e849b640c74a01
    permissions:
      contents: read
      pull-requests: read
      id-token: write

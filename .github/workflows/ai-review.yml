# owner の PR を boykush/adr のルールと照合し、違反が無ければ Claude GitHub App として承認する。
# default branch の ruleset が求める承認は、これで付く。reusable workflow は boykush/workflows
# にあり、入れるときに要るものはその README に書いてある。
name: ai-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: boykush/workflows/.github/workflows/ai-review.yml@3b3624ea2729b78f9608ee3d557020d819358f9c
    permissions:
      contents: read
      pull-requests: read
      id-token: write

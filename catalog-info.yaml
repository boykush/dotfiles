# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (boykush/infrastructure-as-code's applications/backstage/).
# How an entity is written — which edges to draw, what a tag means — is set in
# boykush/github-management's AGENTS.md and the comments atop its catalog/ files.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dotfiles
  description: >-
    マシンの設定一式。coding agent の全体方針（agents/AGENTS.md → ~/.claude/CLAUDE.md）と user
    scope の MCP サーバーを置くので、このマシンの全セッションに効く
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: agent-config
  consumesApis:
    - wiki-mcp
  dependsOn:
    - component:ai-plugins
    - component:workflows
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: doc-refactor-plugin
  description: >-
    文書をコードと同じようにリファクタリングする skill を束ねた plugin（Agent Plugins の形）。直す理由が
    agents/AGENTS.md の方針と同じところで生まれるので、この repo が持つ
spec:
  type: plugin
  lifecycle: production
  owner: user:boykush
  system: agent-config
  skills:
    - airesource:doc-refactor
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: doc-refactor
  description: 事実を機械が読める持ち主へ移し、散文をその参照に置き換える手順
  annotations:
    backstage.io/source-location: url:https://github.com/boykush/dotfiles/tree/main/plugins/doc-refactor/skills/doc-refactor/
spec:
  type: skill
  lifecycle: production
  owner: user:boykush
  system: agent-config
